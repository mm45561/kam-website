# Keeps the free Supabase project awake (free projects pause after 7 days without activity).
# Every 3 days it reads the site settings row, exactly like any visitor's browser does.
# It uses only the public "anon" key already published in js/config.js, so it can read
# nothing that a visitor cannot: student applications stay hidden by Row Level Security.
# No secrets, no write access, no personal data.
name: Keep database awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: js/config.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read public settings
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' js/config.js)
          KEY=$(sed -n 's/.*supabaseAnonKey: *"\([^"]*\)".*/\1/p' js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not connected yet, nothing to do."; exit 0; fi
          case "$URL" in https://*.supabase.co) ;; *) echo "Unexpected Supabase URL"; exit 1;; esac
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/settings?select=id&limit=1")
          echo "Supabase answered: $code"
          [ "$code" = "200" ]
